[project]
name = "quantum-gaps"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "httpx>=0.28.1",
    "pydantic>=2.11.1",
    "pydantic-ai[logfire]>=0.0.48",
    "selenium>=4.30.0",
    "tqdm>=4.67.1",
    "webdriver-manager>=4.0.2",
    "wikipedia-api>=0.8.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jupyterlab>=4.3.6",
    "matplotlib>=3.10.1",
    "numpy>=2.2.4",
    "tiktoken>=0.9.0",
    "ruff>=0.11.5",
]

[tool.ruff]
line-length = 109

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "I"]
ignore = ["E203", "E501"]